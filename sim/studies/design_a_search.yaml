description: "Design A geometry re-optimised for the target profile at 165 G (the legacy bn_design compass search)"
design: het:assemblies/design_a
pipeline: het:pipelines/magnetostatics_2d
measure: het:measurements/target_fit
variables:
  cap_edge:    {param: parts.pole_cap.edge_length, range: [1.0, 9.0]}
  cap_chamfer: {param: parts.pole_cap.chamfer_width, range: [0.0, 10.0]}
  is_gap:      {param: params.inner_screen_gap, range: [8, 30]}
  os_gap:      {param: params.outer_screen_gap, range: [8, 30]}
normalize:
  scale: [op.circuits.inner.current, op.circuits.outer.current]
  so_that: {value: shape.peak_Br, equals: 165}
objectives: {misfit: {minimize: misfit.rms_pct}}
constraints: {saturation: {value: sat.worst, max: 0.8}}
sampler: {kind: compass, start: {cap_edge: 2.5, cap_chamfer: 6.5, is_gap: 18, os_gap: 21.25}, steps: [2, 1, 0.5], max_iter: 40}
